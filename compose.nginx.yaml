# For Nginx installed on the Docker host. Run this file on its own, not merged with compose.yaml.
services:
  memeroom:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MEMEROOM_RELEASES_DIR: /releases
      MEMEROOM_TRUST_PROXY: '1'
      MEMEROOM_SCAN_REQUIRED: '1'
      CLAMAV_HOST: clamav
      MEMEROOM_FFPROBE: /usr/bin/ffprobe
    depends_on:
      clamav:
        # Downloads, rooms and text messages stay available while ClamAV warms up.
        # Media publication still requires a successful antivirus scan.
        condition: service_started
    ports:
      - '127.0.0.1:${MEMEROOM_HTTP_PORT:-3210}:3210'
    volumes:
      - memeroom_data:/data
      - ./releases:/releases:ro
    mem_limit: 768m
  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./deploy/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 4g
volumes:
  memeroom_data:
  clamav_data:
